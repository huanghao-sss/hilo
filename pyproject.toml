[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "Hilo"
version = "0.1.0"
description = "Hilo: HiHiTech's Learned Optimizer - a framework for meta-trained (learned) matrix optimizers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.1"]

[tool.setuptools.packages.find]
include = ["Hilo*"]
